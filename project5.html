<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORMS</title>
    <link rel="stylesheet" href="styleproject5.css">
  </head>
  <body>
    <h1>Course Registration Form</h1>
    <form action="#" method="POST" enctype="multipart/form-data">
      <fieldset>
        <legend>Personal Details</legend>
        <table>
          <tr>
            <td><label for="fn">First Name</label></td>
            <td>
              <input
                type="text"
                id="fn"
                name="FN"
                placeholder="Ex: Sai"
                size="15"
                maxlength="10"
                required
              />
              <p class="First_name">Enter your first name</p><br />
            </td>
          </tr>
          <tr>
            <td><label for="ln">Surname</label></td>
            <td>
              <input
                type="text"
                id="ln"
                name="LN"
                placeholder="Ex: T"
                size="15"
                optional
              />
              <P class="sur_name">Enter your intial</P><br />
            </td>
          </tr>
          <tr>
            <td><label for="mob">Mobile Number</label></td>
            <td>
              <input
                type="tel"
                id="mob"
                name="mob"
                placeholder="Ex: 987-897-0987"
                size="15"
                pattern="[0-9]{10}"
                title="Enter 10 digit mobile number"
                required
              />
              <p class="mobile_number">Enter your mobile number</p><br />
            </td>
          </tr>
          <tr>
            <td><label for="mail">Email</label></td>
            <td>
              <input
                type="email"
                id="mail"
                name="mail"
                size="15"
                placeholder="Ex: rohit@gmail.com"
                required
              />
              <img class="Correct" src="https://static.vecteezy.com/system/resources/previews/026/381/113/original/green-check-mark-icon-correct-answer-or-complete-done-vector.jpg" alt="Correct">
              <img class="Wrong" src="https://static.vecteezy.com/system/resources/previews/022/377/766/original/cross-check-mark-icon-button-and-no-or-wrong-symbol-on-reject-cancel-sign-button-rendering-3d-free-png.png" alt="Wrong"><br />
            </td>
          </tr>
          <tr>
            <td><label for="pwd">Password</label></td>
            <td>
              <input
                type="password"
                id="pwd"
                name="pwd"
                placeholder="min 5 characters"
                size="15"
                minlength="5"
                maxlength="20"
                required
              />
              <p class="Password">Enter valid password</p><br />
            </td>
          </tr>
          <tr>
            <td><label for="cpwd">Confirm Password</label></td>
            <td>
              <input
                type="password"
                id="cpwd"
                name="cpwd"
                placeholder="min 5 characters"
                size="15"
                minlength="5"
                required
              />
              <p class="Password">Reenter the password again</p><br />
            </td>
          </tr>
          <tr>
            <td><label for="dob">DOB</label></td>
            <td>
              <input
                type="date"
                id="dob"
                name="dob"
                min="1950-01-01"
                max="2010-12-31"
                optional
              /><br />
            </td>
          </tr>
          <tr>
            <td><label>Gender</label></td>
            <td>
              <input type="radio" id="male" name="gender" value="M" />
              <label for="male">Male</label>
              <input type="radio" id="female" name="gender" value="F" />
              <label for="female">Female</label>
              <input type="radio" id="custom" name="gender" value="C" />
              <label for="custom">Custom</label>
            </td>
          </tr>
          <tr>
            <td><label for="country">Select Country</label></td>
            <td>
              <select id="country" name="Country">
                <option value="" disabled selected >-- Select --</option>
                <option value="INDIA">INDIA</option>
                <option value="USA">USA</option>
                <option value="China">China</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
                </select
              ><br />
            </td>
          </tr>
          <tr>
            <td><label for="pic">Upload Picture</label></td>
            <td>
              <input type="file" id="pic" name="pic" accept="image/*" 
              optional />
              <br />
            </td>
          </tr>
        </table>
      </fieldset>

      <br />

      <fieldset>
        <legend>Course Details</legend>
        <table>
          <tr>
            <td><label for="course">Select Course</label></td>
            <td>
              <select id="course" name="Course">
                <option value="" disabled selected>-- Select Course --</option>
                <option value="PFS">Python Full Stack</option>
                <option value="JFS">Java Full Stack</option>
                <option value="CJ">MERN STACK</option>
                <option value="PDS">Python for DataScience</option>
              </select>
            </td>
          </tr>
          <tr>
            <td><label>Delivery Mode</label></td>
            <td>
              <input type="checkbox" id="online" name="mode" value="ON" />
              <label for="online">ONLINE</label>
              <input type="checkbox" id="offline" name="mode" value="OFF" />
              <label for="offline">OFFLINE</label>
            </td>
          </tr>
          <tr>
            <td><label for="comments">Comments</label></td>
            <td>
              <textarea
                id="comments"
                name="comments"
                rows="4"
                cols="40"
                placeholder="Enter any additional comments..."
                maxlength="500"
              ></textarea>
            </td>
          </tr>
        </table>
      </fieldset>

      <br />
  </body>
</html>
